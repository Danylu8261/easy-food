<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prato Cheio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --sol:#FFCF33; --sol-claro:#FFF1B8; --anil:#16307A; --pimenta:#E5383B; --texto:#14204A; --display:"Bowlby One","Arial Black",Impact,sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--sol); display: flex; justify-content: center; padding: 20px; }
    :focus-visible { outline: 3px solid var(--pimenta); outline-offset: 2px; }
    .phone { width: 390px; height: 844px; background: #fff; border-radius: 40px; border: 8px solid var(--anil); overflow: hidden; box-shadow: 10px 10px 0 var(--anil); display: flex; flex-direction: column; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px 8px; font-size: 14px; font-weight: 700; flex-shrink: 0; background: var(--sol); color: var(--anil); }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 16px; background: var(--sol); border-bottom: 3px solid var(--anil); flex-shrink: 0; }
    .header-menu { font-size: 22px; cursor: pointer; color: var(--anil); }
    .header-logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 22px; color: var(--anil); }
    .header-logo .icon { font-size: 24px; }
    .header-cart { position: relative; font-size: 22px; cursor: pointer; }
    .cart-badge { position: absolute; top: -6px; right: -8px; background: var(--pimenta); color: #fff; font-size: 10px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; }
    .search-bar { margin: 16px 20px; display: flex; align-items: center; background: #fff; border: 2px solid var(--anil); border-radius: 999px; padding: 10px 16px; gap: 10px; flex-shrink: 0; box-shadow: 3px 3px 0 var(--anil); }
    .search-bar input { border: none; outline: none; background: transparent; flex: 1; font: inherit; font-size: 15px; color: var(--texto); }
    .search-bar input::placeholder { color: #7480a8; }
    .search-bar .filter-icon { font-size: 18px; }
    .categories { display: flex; gap: 10px; padding: 4px 20px 16px; overflow-x: auto; flex-shrink: 0; }
    .categories::-webkit-scrollbar { display: none; }
    .category-chip { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--anil); color: var(--anil); font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: background .15s; user-select: none; }
    .category-chip:hover { background: var(--sol-claro); }
    .category-chip.active { background: var(--anil); color: #fff; }
    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 12px; flex-shrink: 0; }
    .section-header h2 { font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--anil); }
    .section-header .order-btn { font-size: 13px; font-weight: 600; color: var(--anil); cursor: pointer; }
    .restaurant-list { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; overflow-y: auto; }
    .restaurant-list::-webkit-scrollbar { width: 4px; }
    .restaurant-list::-webkit-scrollbar-thumb { background: var(--sol); border-radius: 4px; }
    .restaurant-card { display: flex; align-items: center; padding: 12px; border: 2px solid var(--anil); border-radius: 16px; gap: 14px; background: #fff; box-shadow: 4px 4px 0 var(--anil); animation: fadeIn .3s ease; flex-shrink: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .restaurant-img { width: 76px; height: 76px; background: var(--sol-claro); border: 2px solid var(--anil); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .restaurant-img .placeholder { font-size: 30px; }
    .restaurant-info { flex: 1; min-width: 0; }
    .restaurant-info h3 { font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 1.2; color: var(--anil); margin-bottom: 4px; }
    .restaurant-info .meta { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .restaurant-info .rating { display: inline-flex; align-items: center; gap: 4px; background: var(--sol); border: 2px solid var(--anil); padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .restaurant-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
    .heart { font-size: 20px; color: #aab3d1; cursor: pointer; transition: color .2s; }
    .heart:hover { color: var(--pimenta); }
    .delivery-info { font-size: 11px; text-align: right; }
    .delivery-info .price { font-weight: 700; color: var(--anil); }
    .load-more-btn { display: block; width: 100%; padding: 13px; margin-top: 4px; background: var(--sol); border: 2px solid var(--anil); border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; color: var(--anil); cursor: pointer; box-shadow: 3px 3px 0 var(--anil); flex-shrink: 0; }
    .load-more-btn:hover { background: var(--anil); color: #fff; }
    .load-more-btn:disabled { opacity: .6; cursor: not-allowed; }
    .loading, .empty { text-align: center; padding: 56px 20px; color: #55608a; font-size: 14px; font-weight: 600; }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 4px solid var(--sol-claro); border-top-color: var(--anil); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mini-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #b9c0da; border-top-color: var(--anil); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    .empty .icon { font-size: 40px; margin-bottom: 12px; }
    .error { text-align: center; padding: 40px 20px; color: var(--pimenta); font-size: 14px; }
    .error .icon { font-size: 32px; margin-bottom: 8px; }
    .error code { background: var(--sol-claro); color: var(--anil); padding: 1px 6px; border-radius: 6px; }
    .add-restaurant-section { display: none; padding: 20px; flex: 1; overflow-y: auto; }
    .add-restaurant-section.active { display: block; }
    .add-restaurant-section h2 { font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--anil); margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--anil); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 2px solid var(--anil); border-radius: 12px; font: inherit; font-size: 14px; outline: none; background: #fff; color: var(--texto); }
    .form-group input:focus, .form-group select:focus { background: var(--sol-claro); }
    .submit-btn { width: 100%; padding: 14px; background: var(--anil); color: #fff; border: none; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 4px 4px 0 var(--pimenta); margin-top: 8px; }
    .submit-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--pimenta); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }
    .form-message { text-align: center; padding: 10px; margin-top: 14px; border-radius: 10px; font-size: 13px; font-weight: 600; display: none; }
    .form-message.success { display: block; background: #e6f4e8; color: #22622a; }
    .form-message.error { display: block; background: #fde8e8; color: #a11d1d; }
    .bottom-nav { display: flex; justify-content: space-around; padding: 10px 0; background: var(--sol); border-top: 3px solid var(--anil); flex-shrink: 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #6b5a10; cursor: pointer; }
    .nav-item.active { color: var(--anil); font-weight: 700; }
    .nav-item .icon { font-size: 20px; }
    @media (max-width: 480px) { body { padding: 0; } .phone { width: 100vw; height: 100vh; border: none; border-radius: 0; box-shadow: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    .phone { position: relative; }
    .section-header { position: relative; }
    .order-btn { user-select: none; }
    .order-menu { position: absolute; right: 20px; top: 38px; z-index: 5; background: #fff; border: 2px solid var(--anil); border-radius: 12px; box-shadow: 3px 3px 0 var(--anil); overflow: hidden; }
    .order-menu button { display: block; width: 100%; text-align: left; padding: 9px 18px; border: 0; background: #fff; font: inherit; font-size: 13px; font-weight: 600; color: var(--anil); cursor: pointer; }
    .order-menu button[aria-checked="true"] { background: var(--sol); }
    button.heart { border: 0; background: none; padding: 0; line-height: 1; }
    .heart.on { color: var(--pimenta); }
    .restaurant-card { cursor: pointer; }
    .tag-top { font-size: 11px; font-weight: 700; background: var(--pimenta); color: #fff; border-radius: 999px; padding: 2px 8px; margin-left: 4px; }
    .stars { color: #D69A00; font-size: 20px; letter-spacing: 2px; }
    .header-cart:hover { transform: rotate(20deg); }
    .toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--anil); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; z-index: 10; }
    .toast.show { opacity: 1; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .stat { border: 2px solid var(--anil); border-radius: 14px; padding: 12px; box-shadow: 3px 3px 0 var(--anil); }
    .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--anil); }
    .stat span { font-size: 12px; font-weight: 600; }
    .perfil-linha { font-size: 14px; margin-bottom: 8px; }
    .btn-link { background: none; border: 2px solid var(--anil); color: var(--anil); border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 8px; }
    #sheet { border: 3px solid var(--anil); border-radius: 20px; padding: 0; width: min(320px, 90vw); box-shadow: 6px 6px 0 var(--anil); color: var(--texto); }
    #sheet::backdrop { background: rgba(22, 48, 122, .55); }
    .sheet-in { padding: 22px; text-align: center; }
    .sheet-emoji { font-size: 54px; width: 96px; height: 96px; margin: 0 auto 10px; background: var(--sol-claro); border: 2px solid var(--anil); border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .sheet-in h2 { font-family: var(--display); font-weight: 400; color: var(--anil); font-size: 20px; line-height: 1.2; }
    .sheet-in p { margin: 4px 0; font-size: 14px; font-weight: 600; }
    .sheet-acoes { display: flex; gap: 10px; margin-top: 16px; }
    .sheet-acoes button { flex: 1; padding: 11px; border-radius: 999px; border: 2px solid var(--anil); font: inherit; font-weight: 700; cursor: pointer; }
    #sheet-fav { background: var(--anil); color: #fff; }
    #sheet-fechar { background: #fff; color: var(--anil); }
    .search-bar { margin: 10px 20px 12px; }
    .categories { padding-bottom: 12px; }
    .saudacao { padding: 12px 20px 0; flex-shrink: 0; }
    .saudacao b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--anil); }
    .saudacao span { font-size: 12px; font-weight: 600; }
    .destaque { display: flex; align-items: center; gap: 12px; background: var(--anil); color: #fff; border: 2px solid var(--anil); border-radius: 18px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--pimenta); cursor: pointer; flex-shrink: 0; }
    .destaque-txt { flex: 1; min-width: 0; }
    .destaque-tag { display: inline-block; background: var(--sol); color: var(--anil); font-weight: 700; font-size: 11px; border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
    .destaque h3 { font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1.15; color: var(--sol); }
    .destaque p { font-size: 12px; margin: 4px 0; }
    .destaque-nota { font-size: 12px; font-weight: 700; }
    .destaque-emoji { font-size: 52px; line-height: 1; }
    .slogan { font-style: italic; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
    .heart.pop { animation: pop .35s ease; }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="clock">9:41</span>
      <span>📶 🔋</span>
    </div>

    <!-- Header -->
    <div class="header">
      <span class="header-menu">☰</span>
      <div class="header-logo">
        <span class="icon">🍛</span>
        <span>Prato Cheio</span>
      </div>
      <span class="header-cart" id="surprise" role="button" tabindex="0" title="Me surpreenda" aria-label="Me surpreenda: sortear um restaurante">🎲</span>
    </div>

    <div class="saudacao" id="saudacao"><b>Fome de quê?</b><span>Carregando o cardápio…</span></div>

    <!-- Search -->
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Buscar restaurantes" aria-label="Buscar restaurantes" autocomplete="off">
      <span class="filter-icon" id="clear-search" role="button" tabindex="0" title="Limpar busca" aria-label="Limpar busca" style="cursor:pointer">✕</span>
    </div>

    <!-- Categories -->
    <div class="categories" id="categories">
      <div class="category-chip active" data-category="Todos">🍽️ Todos</div>
      <div class="category-chip" data-category="Burger">🍔 Burger</div>
      <div class="category-chip" data-category="Pizza">🍕 Pizza</div>
      <div class="category-chip" data-category="Sushi">🍣 Sushi</div>
      <div class="category-chip" data-category="Saudável">🥗 Saudável</div>
    </div>

    <!-- Section header -->
    <div class="section-header">
      <h2>Restaurantes</h2>
      <span class="order-btn" id="order-btn" role="button" tabindex="0" aria-haspopup="true">Ordenar ▾</span>
    </div>

    <!-- Restaurant list (scrollable) -->
    <div class="restaurant-list" id="restaurant-list">
      <div class="loading">
        <div class="spinner"></div>
        <p>Carregando restaurantes...</p>
      </div>
    </div>

    <!-- Add Restaurant Form (hidden by default) -->
    <div class="add-restaurant-section" id="add-restaurant-section">
      <h2>➕ Cadastrar Restaurante</h2>
      <form id="add-restaurant-form">
        <div class="form-group">
          <label for="restaurant-name">Nome do Restaurante</label>
          <input type="text" id="restaurant-name" placeholder="Ex: Tacos do Zé" required>
        </div>
        <div class="form-group">
          <label for="restaurant-category">Categoria</label>
          <select id="restaurant-category" required>
            <option value="">Selecione uma categoria</option>
            <option value="Burger">🍔 Burger</option>
            <option value="Pizza">🍕 Pizza</option>
            <option value="Sushi">🍣 Sushi</option>
            <option value="Saudável">🥗 Saudável</option>
            <option value="Mexicana">🌮 Mexicana</option>
            <option value="Brasileira">🍛 Brasileira</option>
            <option value="Japonesa">🍱 Japonesa</option>
            <option value="Italiana">🍝 Italiana</option>
          </select>
        </div>
        <div class="form-group">
          <label for="restaurant-rating">Avaliação (0 a 5)</label>
          <input type="number" id="restaurant-rating" placeholder="Ex: 4.3" min="0" max="5" step="0.1" required>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Cadastrar Restaurante</button>
      </form>
      <div class="form-message" id="form-message"></div>
    </div>

    <!-- Perfil -->
    <div class="add-restaurant-section" id="profile-section"></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Bottom nav -->
    <div class="bottom-nav">
      <div class="nav-item active" data-view="home">
        <span class="icon">🏠</span>
        <span>Início</span>
      </div>
      <div class="nav-item" data-view="search">
        <span class="icon">🔍</span>
        <span>Buscar</span>
      </div>
      <div class="nav-item" data-view="add">
        <span class="icon">➕</span>
        <span>Cadastrar</span>
      </div>
      <div class="nav-item" data-view="favorites">
        <span class="icon">❤️</span>
        <span>Favoritos</span>
      </div>
      <div class="nav-item" data-view="profile">
        <span class="icon">👤</span>
        <span>Perfil</span>
      </div>
    </div>
  </div>

  <dialog id="sheet" aria-labelledby="sheet-nome">
    <div class="sheet-in">
      <div class="sheet-emoji" id="sheet-emoji" aria-hidden="true"></div>
      <h2 id="sheet-nome"></h2>
      <p id="sheet-meta"></p>
      <p class="slogan" id="sheet-slogan"></p>
      <p class="stars" id="sheet-stars" aria-hidden="true"></p>
      <p id="sheet-nota"></p>
      <div class="sheet-acoes">
        <button type="button" id="sheet-fav">♡ Favoritar</button>
        <button type="button" id="sheet-fechar">Fechar</button>
      </div>
    </div>
  </dialog>

  <script>
    // =============================================================
    // Prato Cheio - Front-end
    // Consome a API (GET/POST /restaurants) com filtro por categoria,
    // busca, ordenação, paginação, favoritos, detalhes e perfil.
    // =============================================================

    const API_URL = "http://localhost:3000/restaurants";
    const PAGE_SIZE = 4; // quantos restaurantes por vez

    // Estado da aplicação
    let allRestaurants = [];
    let filteredRestaurants = [];
    let selectedCategory = "Todos";
    let currentPage = 0;
    let searchQuery = "";
    let sortMode = localStorage.getItem("pc_sort") || "nota";
    let currentView = "home";
    let favorites = new Set(JSON.parse(localStorage.getItem("pc_favs") || "[]"));

    const categoryEmoji = {
      "Pizza": "🍕", "Burger": "🍔", "Sushi": "🍣", "Saudável": "🥗",
      "Mexicana": "🌮", "Brasileira": "🍛", "Japonesa": "🍱", "Italiana": "🍝"
    };
    // Cor de cada categoria (fundo do emoji) e frases de efeito
    const categoryTint = { "Pizza": "#FFD1CC", "Burger": "#FFE0A8", "Sushi": "#FFD6E6", "Saudável": "#CDEFC5" };
    const slogans = {
      "Pizza": ["Borda recheada e coração cheio.", "Assada na hora, devorada na hora.", "Uma fatia nunca é só uma.", "O forno acende e o bairro sente o cheiro."],
      "Burger": ["Suculento até o último guardanapo.", "Chapa quente, queijo derretendo.", "Pão macio, carne na medida.", "Para quem não tem medo de sujar a mão."],
      "Sushi": ["Fresco, delicado e sem pressa.", "Cada peça é um pequeno detalhe.", "Enrolado com muito carinho.", "Hashi na mão, fome de sobra."],
      "Saudável": ["Leve por fora, feliz por dentro.", "Cores de sobra, culpa nenhuma.", "Fresco da horta ao seu prato.", "Comer bem também é diversão."]
    };
    const sloganOf = (r) => { const l = slogans[r.category]; return l ? l[r.id % l.length] : "Feito com carinho para você."; };
    const tintOf = (cat) => categoryTint[cat] || "#EDEDED";
    let justFavId = null;
    const sortLabels = { nota: "Melhor nota", nome: "A–Z", recentes: "Mais recentes" };
    const sorters = {
      nota: (a, b) => Number(b.rating || 0) - Number(a.rating || 0),
      nome: (a, b) => a.name.localeCompare(b.name, "pt-BR"),
      recentes: (a, b) => b.id - a.id
    };

    // ----- utilidades -----
    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, ...kids) => {
      const n = Object.assign(document.createElement(tag), props);
      n.append(...kids);
      return n;
    };
    const emojiOf = (cat) => categoryEmoji[cat] || "🏪";
    const fmt = (n) => Number(n).toFixed(1).replace(".", ",");
    const stars = (n) => { const r = Math.round(Number(n) || 0); return "★".repeat(r) + "☆".repeat(5 - r); };
    const listEl = () => $("restaurant-list");

    // Preço de entrega fixo por restaurante (não muda ao recarregar)
    const deliveryPrices = {};
    function getDeliveryPrice(id) {
      if (!deliveryPrices[id]) deliveryPrices[id] = (Math.random() * 5 + 3).toFixed(2).replace(".", ",");
      return deliveryPrices[id];
    }

    let toastTimer;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    // ----- LOADING / ERRO -----
    function showLoading() {
      listEl().innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando restaurantes...</p></div>';
    }
    function showError() {
      listEl().innerHTML = `
        <div class="error">
          <div class="icon">⚠️</div>
          <p><strong>Servidor offline</strong></p>
          <p style="margin-top:8px;">Rode no terminal:<br><code>node server.js</code></p>
        </div>`;
    }

    // ----- FETCH -----
    async function fetchRestaurants() {
      showLoading();
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Status " + response.status);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Resposta inesperada");
        allRestaurants = data;
        renderSaudacao();
        filterAndRender();
      } catch (error) {
        showError();
      }
    }

    // ----- FILTRO + BUSCA + ORDEM + PAGINAÇÃO -----
    function filterAndRender() {
      const q = searchQuery.trim().toLowerCase();
      filteredRestaurants = allRestaurants
        .filter((r) => selectedCategory === "Todos" || r.category === selectedCategory)
        .filter((r) => currentView !== "favorites" || favorites.has(r.id))
        .filter((r) => r.name.toLowerCase().includes(q))
        .sort(sorters[sortMode]);
      currentPage = 0;
      renderPage();
      listEl().scrollTop = 0;
    }

    function buildCard(r, index, isTop) {
      const fav = favorites.has(r.id);
      const heart = el("button", {
        className: "heart" + (fav ? " on" : "") + (r.id === justFavId ? " pop" : ""), type: "button", textContent: fav ? "♥" : "♡",
        onclick: (e) => { e.stopPropagation(); toggleFavorite(r.id); }
      });
      heart.setAttribute("aria-label", (fav ? "Tirar dos favoritos: " : "Favoritar: ") + r.name);
      heart.setAttribute("aria-pressed", fav);

      const rating = el("div", { className: "rating", textContent: "★ " + (r.rating != null ? fmt(r.rating) : "–") });
      if (isTop) rating.append(el("span", { className: "tag-top", textContent: "🏆 Top" }));

      const card = el("div", { className: "restaurant-card", tabIndex: 0, onclick: () => openSheet(r) },
        el("div", { className: "restaurant-img" }, el("span", { className: "placeholder", textContent: emojiOf(r.category) })),
        el("div", { className: "restaurant-info" },
          el("h3", { textContent: r.name }),
          el("div", { className: "meta", textContent: (r.category || "Sem categoria") + " • 20-30 min" }),
          rating),
        el("div", { className: "restaurant-right" }, heart,
          el("div", { className: "delivery-info" }, "Entrega", el("br"),
            el("span", { className: "price", textContent: "R$ " + getDeliveryPrice(r.id) }))));
      card.querySelector(".restaurant-img").style.background = tintOf(r.category);
      card.setAttribute("role", "button");
      card.style.animationDelay = index * 0.05 + "s";
      card.addEventListener("keydown", (e) => { if (e.key === "Enter") openSheet(r); });
      return card;
    }

    // ----- PRATO DO DIA: um restaurante diferente a cada dia -----
    function featuredOf() {
      if (!allRestaurants.length) return null;
      const d = new Date();
      const day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
      const pool = [...allRestaurants].sort((a, b) => a.id - b.id);
      return pool[day % pool.length];
    }
    function buildFeatured(r) {
      const card = el("div", { className: "destaque", tabIndex: 0, onclick: () => openSheet(r) },
        el("div", { className: "destaque-txt" },
          el("span", { className: "destaque-tag", textContent: "Prato do dia" }),
          el("h3", { textContent: r.name }),
          el("p", { textContent: sloganOf(r) }),
          el("span", { className: "destaque-nota", textContent: "★ " + (r.rating != null ? fmt(r.rating) : "–") + " • " + (r.category || "Sem categoria") })),
        el("div", { className: "destaque-emoji", textContent: emojiOf(r.category) }));
      card.setAttribute("role", "button");
      card.addEventListener("keydown", (e) => { if (e.key === "Enter") openSheet(r); });
      return card;
    }
    function renderSaudacao() {
      const h = new Date().getHours();
      const [icone, texto] = h < 12 ? ["☀️", "Bom dia"] : h < 18 ? ["🌤️", "Boa tarde"] : ["🌙", "Boa noite"];
      const n = allRestaurants.length;
      $("saudacao").innerHTML = "";
      $("saudacao").append(el("b", { textContent: icone + " " + texto + "! Fome de quê?" }),
        el("span", { textContent: n ? n + (n === 1 ? " restaurante esperando" : " restaurantes esperando") + " por você" : "Nenhum restaurante por aqui ainda" }));
    }
    function updateClock() {
      $("clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function renderPage() {
      const list = listEl();
      const y = list.scrollTop;
      const end = (currentPage + 1) * PAGE_SIZE;
      const visible = filteredRestaurants.slice(0, end);

      if (visible.length === 0) {
        const msg = currentView === "favorites"
          ? "Você ainda não favoritou ninguém.<br>Toque no ♡ de um restaurante."
          : "Nenhum restaurante encontrado<br>com esses filtros.";
        list.innerHTML = `<div class="empty"><div class="icon">${currentView === "favorites" ? "💛" : "🔍"}</div><p>${msg}</p></div>`;
        return;
      }

      const best = Math.max(0, ...allRestaurants.map((r) => Number(r.rating || 0)));
      const cards = visible.map((r, i) => buildCard(r, i, best > 0 && Number(r.rating) === best));
      justFavId = null;
      const destaque = featuredOf();
      if (destaque && currentView === "home" && selectedCategory === "Todos" && !searchQuery.trim()) cards.unshift(buildFeatured(destaque));
      const remaining = filteredRestaurants.length - end;
      if (remaining > 0) {
        cards.push(el("button", {
          className: "load-more-btn", id: "load-more-btn", onclick: loadMore,
          textContent: `Carregar mais (${remaining} restante${remaining > 1 ? "s" : ""})`
        }));
      }
      list.replaceChildren(...cards);
      list.scrollTop = y;
    }

    function loadMore() {
      const btn = $("load-more-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="mini-spinner"></span> Carregando...';
      setTimeout(() => { currentPage++; renderPage(); }, 350);
    }

    // ----- FAVORITOS -----
    function toggleFavorite(id) {
      const r = allRestaurants.find((x) => x.id === id);
      if (favorites.has(id)) { favorites.delete(id); toast("Removido dos favoritos"); }
      else { favorites.add(id); justFavId = id; toast("♥ " + (r ? r.name : "Restaurante") + " favoritado"); }
      localStorage.setItem("pc_favs", JSON.stringify([...favorites]));
      if (currentView === "favorites") filterAndRender(); else renderPage();
    }

    // ----- DETALHES -----
    let sheetRestaurant = null;
    function openSheet(r) {
      sheetRestaurant = r;
      $("sheet-emoji").textContent = emojiOf(r.category);
      $("sheet-nome").textContent = r.name;
      $("sheet-slogan").textContent = "“" + sloganOf(r) + "”";
      $("sheet-emoji").style.background = tintOf(r.category);
      $("sheet-meta").textContent = (r.category || "Sem categoria") + " • entrega em 20-30 min";
      $("sheet-stars").textContent = stars(r.rating);
      $("sheet-nota").textContent = r.rating != null ? "Nota " + fmt(r.rating) + " de 5" : "Ainda sem nota";
      updateSheetFav();
      $("sheet").showModal();
    }
    function updateSheetFav() {
      $("sheet-fav").textContent = favorites.has(sheetRestaurant.id) ? "♥ Favorito" : "♡ Favoritar";
    }

    // ----- ME SURPREENDA -----
    function surprise() {
      const pool = filteredRestaurants.length ? filteredRestaurants : allRestaurants;
      if (!pool.length) { toast("Nenhum restaurante para sortear"); return; }
      openSheet(pool[Math.floor(Math.random() * pool.length)]);
    }

    // ----- ORDENAR -----
    function updateOrderLabel() { $("order-btn").textContent = sortLabels[sortMode] + " ▾"; }
    function toggleOrderMenu() {
      const old = document.querySelector(".order-menu");
      if (old) { old.remove(); return; }
      const menu = el("div", { className: "order-menu", role: "menu" },
        ...Object.keys(sortLabels).map((key) => {
          const b = el("button", { type: "button", textContent: sortLabels[key], onclick: () => {
            sortMode = key; localStorage.setItem("pc_sort", key);
            menu.remove(); updateOrderLabel(); filterAndRender();
          } });
          b.setAttribute("aria-checked", key === sortMode);
          return b;
        }));
      document.querySelector(".section-header").append(menu);
    }

    // ----- PERFIL -----
    function renderPerfil() {
      const box = $("profile-section");
      const total = allRestaurants.length;
      const media = total ? allRestaurants.reduce((s, r) => s + Number(r.rating || 0), 0) / total : 0;
      const favs = allRestaurants.filter((r) => favorites.has(r.id)).length;
      const cats = new Set(allRestaurants.map((r) => r.category).filter(Boolean)).size;
      const top = [...allRestaurants].sort(sorters.nota)[0];
      const stat = (valor, rotulo) => el("div", { className: "stat" }, el("b", { textContent: valor }), el("span", { textContent: rotulo }));
      box.replaceChildren(
        el("h2", { textContent: "👤 Seu perfil" }),
        el("div", { className: "stat-grid" },
          stat(String(total), "restaurantes"), stat(String(favs), "favoritos"),
          stat(total ? fmt(media) : "–", "nota média"), stat(String(cats), "categorias")),
        el("p", { className: "perfil-linha", textContent: top ? "🏆 Mais bem avaliado: " + top.name + " (" + fmt(top.rating) + ")" : "Nenhum restaurante carregado ainda." }),
        el("button", { className: "btn-link", type: "button", textContent: "Limpar favoritos", onclick: () => {
          favorites.clear(); localStorage.setItem("pc_favs", "[]"); renderPerfil(); toast("Favoritos limpos");
        } }));
    }

    // ----- NAVEGAÇÃO ENTRE TELAS -----
    function switchView(view) {
      currentView = view;
      const isList = view === "home" || view === "search" || view === "favorites";
      document.querySelectorAll(".saudacao, .search-bar, .categories, .section-header, .restaurant-list")
        .forEach((e) => (e.style.display = isList ? "" : "none"));
      $("add-restaurant-section").classList.toggle("active", view === "add");
      $("profile-section").classList.toggle("active", view === "profile");
      document.querySelectorAll(".nav-item").forEach((i) => i.classList.toggle("active", i.dataset.view === view));
      document.querySelector(".section-header h2").textContent = view === "favorites" ? "Favoritos" : "Restaurantes";
      if (view === "profile") renderPerfil();
      if (isList) { filterAndRender(); if (view === "search") $("search-input").focus(); }
    }

    // ----- EVENTOS -----
    const chips = document.querySelectorAll(".category-chip");
    chips.forEach((chip) => chip.addEventListener("click", () => {
      chips.forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      selectedCategory = chip.dataset.category;
      filterAndRender();
    }));

    $("search-input").addEventListener("input", (e) => { searchQuery = e.target.value; filterAndRender(); });
    $("clear-search").addEventListener("click", () => { $("search-input").value = ""; searchQuery = ""; filterAndRender(); });
    $("order-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleOrderMenu(); });
    document.addEventListener("click", () => { const m = document.querySelector(".order-menu"); if (m) m.remove(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("[role=button]:not(.restaurant-card)")) e.target.click(); });
    $("surprise").addEventListener("click", surprise);
    document.querySelectorAll(".nav-item").forEach((i) => i.addEventListener("click", () => switchView(i.dataset.view)));
    $("sheet-fechar").addEventListener("click", () => $("sheet").close());
    $("sheet-fav").addEventListener("click", () => { toggleFavorite(sheetRestaurant.id); updateSheetFav(); });

    // ----- CADASTRO: POST /restaurants -----
    const addForm = $("add-restaurant-form");
    const formMessage = $("form-message");

    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("restaurant-name").value.trim();
      const category = $("restaurant-category").value;
      const rating = parseFloat($("restaurant-rating").value);

      if (!name || !category || isNaN(rating)) {
        showFormMessage("Preencha todos os campos corretamente.", "error");
        return;
      }
      const submitBtn = $("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Cadastrando...";
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, category, rating })
        });
        if (!response.ok) throw new Error("Erro ao cadastrar restaurante");
        const created = await response.json();
        allRestaurants.push(created);
        addForm.reset();
        showFormMessage(`✅ "${created.name}" cadastrado com sucesso!`, "success");
        filterAndRender();
      } catch (error) {
        showFormMessage("❌ Erro ao cadastrar. Verifique se o servidor está rodando.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Cadastrar Restaurante";
      }
    });

    function showFormMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = "form-message " + type;
      setTimeout(() => { formMessage.className = "form-message"; }, 4000);
    }

    // ----- INICIALIZA -----
    updateOrderLabel();
    updateClock();
    setInterval(updateClock, 30000);
    fetchRestaurants();
  </script>
</body>
</html>
